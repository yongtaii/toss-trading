<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Toss Trading · PAPER 대시보드</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/dashboard/style.css" />
    <script defer src="/dashboard/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand"
        ><span class="brand-icon">t</span> trading<span class="brand-dot"
          >.</span
        ></span
      >
      <span class="paper-badge">모의투자</span>
      <span class="topbar-strategy">전략 <strong id="strategy">—</strong></span>
      <div class="topbar-actions">
        <label class="sr-only" for="ledger">원장 선택</label
        ><select id="ledger">
          <option value="primary">기본 전략</option>
          <option value="compare" disabled>비교 전략 · 미설정</option></select
        ><button id="refresh" type="button">↻ 새로고침</button>
      </div>
    </header>
    <main>
      <div id="notice" class="notice" role="status" aria-live="polite">
        PAPER 원장을 불러오고 있습니다.
      </div>

      <section class="summary" aria-label="자산 요약">
        <div class="summary-main">
          <span class="summary-label">총자산</span>
          <strong id="equity">—</strong>
          <p id="total-pnl">원장 연결 대기</p>
        </div>
        <dl class="summary-sub">
          <div>
            <dt>실현손익</dt>
            <dd id="realized">—</dd>
          </div>
          <div>
            <dt>평가손익</dt>
            <dd id="unrealized">—</dd>
          </div>
          <div>
            <dt>보유 현금</dt>
            <dd id="cash">—</dd>
          </div>
        </dl>
      </section>

      <section class="status-strip" aria-label="운영 상태">
        <div class="status-item">
          <span class="status-label">자동매매</span>
          <strong id="engine-state">확인 중</strong>
          <small id="engine-detail">—</small>
        </div>
        <div class="status-item">
          <span class="status-label">시세 수집</span>
          <strong id="feed-state">확인 중</strong>
          <small id="feed-detail">—</small>
        </div>
        <div class="status-item">
          <span class="status-label" id="market-clock-label">다음 개장까지</span>
          <strong id="market-countdown">—</strong>
          <small id="market-next-open">시장 일정 확인 중</small>
        </div>
      </section>
      <div id="collector-error" class="collector-error" hidden role="status"></div>

      <section class="panel">
        <div class="panel-heading">
          <h2>누적 실현손익</h2>
          <span class="subtle-badge" id="chart-summary">—</span>
        </div>
        <div id="chart" class="chart">
          <p class="empty">매도가 체결되면 그래프가 표시됩니다.</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>종목 현황</h2>
          <span class="subtle-badge">매수 신호 조건</span>
        </div>
        <div id="entry-conditions" class="entry-grid">
          <p class="empty">전략 판단을 기다리고 있습니다.</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>포지션 · 주문</h2>
          <div class="tabs" role="group" aria-label="내역 선택">
            <button
              class="selected"
              id="positions-tab"
              type="button"
              aria-pressed="true"
            >
              보유 포지션</button
            ><button id="orders-tab" type="button" aria-pressed="false">
              미체결 주문
            </button>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead id="portfolio-head"></thead>
            <tbody id="portfolio-body">
              <tr>
                <td class="empty">원장 연결 대기</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>최근 활동</h2>
          <label class="sr-only" for="event-filter">활동 필터</label
          ><select id="event-filter">
            <option value="important">주요 활동</option>
            <option value="fills">체결</option>
            <option value="all">전체</option>
          </select>
        </div>
        <div id="events"><p class="empty">원장 연결 대기</p></div>
      </section>

      <footer>
        <span id="updated">10초마다 자동 갱신</span>
      </footer>
    </main>
  </body>
</html>
