name: Deploy LIVE
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to GitHub Container Registry
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select tested main image for LIVE
        run: |
          image=ghcr.io/yongtaii/toss-trading
          docker buildx imagetools create -t "$image:live" "$image:sha-$GITHUB_SHA"
