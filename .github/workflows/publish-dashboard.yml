name: Publish Dashboard
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-dashboard
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          image=ghcr.io/yongtaii/toss-trading
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:sha-$GITHUB_SHA" .
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create -t "$image:dashboard" "$image:sha-$GITHUB_SHA"
          fi
